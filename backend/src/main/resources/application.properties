spring.config.import=optional:file:./.env[.properties]

# Application
spring.application.name=job-agent-backend
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/jobagent
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.example.jobagent=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
#app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}
# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local directory where uploaded resumes will be stored
app.storage.resume-dir=./uploads/resumes

# Custom Spring Security In-Memory Credentials
spring.security.user.name=admin
spring.security.user.password=your_secure_password_here
spring.security.user.roles=ADMIN

